name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The /away pane's tests run in Claude Code's own mod kit, pinned to the version it was built on.
      - run: npm i -g @anthropic-ai/claude-code@2.1.316 && pnpm test:plugin
      - run: pnpm build
      - run: pnpm docs:gen && git diff --exit-code docs/

  # The live test of the worker user, made as the action makes it.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/worker-user.sh
      # A second profile's worker user, for the proof that two profiles run at once, each kill reaching only its own user.
      - run: |
          sudo useradd --no-create-home --user-group --shell /usr/sbin/nologin awaywork-proof
          echo awaywork-proof | sudo tee -a /etc/cron.deny > /dev/null
      - run: pnpm vitest run test/real-isolation.test.ts test/launch.test.ts
        env:
          AWAYWORK_WORKER_TEST: "1"
      # Alone: the other files kill every process of the worker user, the wall's probe included.
      - run: pnpm vitest run test/real-wall.test.ts
        env:
          AWAYWORK_WORKER_TEST: "1"

  # The live test of isolation: container, on the runner's Docker engine.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker pull -q alpine:3.22
      - run: pnpm vitest run test/real-container.test.ts
        env:
          AWAYWORK_CONTAINER_TEST: alpine:3.22

  # The container template still builds; the newest release stands in for a version not published yet.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: mkdir docker/.awaywork && touch docker/.awaywork/config.yml
      - run: docker build --build-arg AWAYWORK_VERSION=latest docker
