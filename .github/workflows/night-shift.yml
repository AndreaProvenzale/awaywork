name: night-shift

on:
  schedule:
    - cron: "0 18 * * *"
      timezone: Europe/Rome
  workflow_dispatch:

concurrency: night-shift

jobs:
  night:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
      NIGHT_SHIFT_CONFIG: .night-shift/config.yml
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      # Dogfoods main from source, unlike the generated workflow's npm install.
      - run: npm install -g . @anthropic-ai/claude-code @openai/codex
      - name: Commit as the token's user
        run: |
          user=$(gh api user --jq '"\(.id)+\(.login)"')
          git config --global user.name "${user#*+}"
          git config --global user.email "$user@users.noreply.github.com"
      - run: nightshift run ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      - name: Morning report
        if: always()
        run: nightshift report >> "$GITHUB_STEP_SUMMARY" || true
