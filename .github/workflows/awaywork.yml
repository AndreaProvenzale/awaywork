name: awaywork

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

concurrency: awaywork

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Europe/Rome
      AWAYWORK_CONFIG: .awaywork/config.yml
    steps:
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      # Dogfoods main from source, unlike the generated workflow's npm install.
      - run: npm install -g . @anthropic-ai/claude-code
      - name: Commit as the token's user
        run: |
          user=$(gh api user --jq '"\(.id)+\(.login)"')
          git config --global user.name "${user#*+}"
          git config --global user.email "$user@users.noreply.github.com"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Make the worker user
        run: bash scripts/worker-user.sh
      - id: run
        run: awaywork run ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Morning report
        if: always()
        run: awaywork report >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload the run
        if: always() && steps.run.outputs.run-id != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}-${{ steps.run.outputs.run-id }}
          path: |
            ${{ steps.run.outputs.run-dir }}/report.md
            ${{ steps.run.outputs.run-dir }}/report.json
            ${{ steps.run.outputs.run-dir }}/units.json
          if-no-files-found: ignore
