name: awaywork
description: Run awaywork once from a checked-out repo, on a GitHub-hosted or self-hosted runner
branding:
  icon: moon
  color: purple

inputs:
  config:
    description: Repo path of the awaywork config
    default: .awaywork/config.yml
  version:
    description: The awaywork version to install
    required: true
  packages:
    description: Extra npm packages to install on a GitHub-hosted runner, such as the providers' CLIs, space-separated
    default: ''

runs:
  using: composite
  steps:
    - name: Check GH_TOKEN
      shell: bash
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::GH_TOKEN is empty: the job's secrets didn't reach it. Set the GH_TOKEN repository secret, or GH_TOKEN__<PERSON> in a shared control repo."
          exit 1
        fi
    # Preinstalled SDKs the runner doesn't need, about 20 GB (docs/providers.md, "Runners die quietly").
    - name: Free disk
      if: runner.environment == 'github-hosted'
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    # Its default cache needs the package manager a control repo's package.json names.
    - uses: actions/setup-node@v5
      with:
        node-version: 22
        package-manager-cache: false
    - name: Install
      if: runner.environment == 'github-hosted'
      shell: bash
      run: npm install -g "awaywork@$VERSION" $PACKAGES
      env:
        VERSION: ${{ inputs.version }}
        PACKAGES: ${{ inputs.packages }}
    # The machine's own installs and logins stay as they are; this folder is emptied every job.
    - name: Install for this job
      if: runner.environment != 'github-hosted'
      shell: bash
      run: |
        npm install -g --prefix "$RUNNER_TEMP/awaywork" "awaywork@$VERSION"
        echo "$RUNNER_TEMP/awaywork/bin" >> "$GITHUB_PATH"
      env:
        VERSION: ${{ inputs.version }}
    # For this job only: a self-hosted machine's git config is the developer's own.
    - name: Commit as the token's user
      shell: bash
      run: |
        user=$(gh api user --jq '"\(.id)+\(.login)"')
        {
          echo "GIT_AUTHOR_NAME=${user#*+}"
          echo "GIT_COMMITTER_NAME=${user#*+}"
          echo "GIT_AUTHOR_EMAIL=$user@users.noreply.github.com"
          echo "GIT_COMMITTER_EMAIL=$user@users.noreply.github.com"
        } >> "$GITHUB_ENV"
    - name: Run
      id: run
      shell: bash
      run: awaywork run ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      env:
        AWAYWORK_CONFIG: ${{ inputs.config }}
    - name: Morning report
      if: always()
      shell: bash
      run: awaywork report >> "$GITHUB_STEP_SUMMARY" || true
      env:
        AWAYWORK_CONFIG: ${{ inputs.config }}
    # `awaywork report` in the control repo reads runs from these; only this run's files, never the whole runs dir.
    - name: Upload the run
      if: always() && steps.run.outputs.run-id != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.workflow }}-${{ steps.run.outputs.run-id }}
        path: |
          ${{ steps.run.outputs.run-dir }}/report.md
          ${{ steps.run.outputs.run-dir }}/units.json
        if-no-files-found: ignore
