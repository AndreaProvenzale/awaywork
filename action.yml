name: night-shift
description: Run one night of night-shift on a hosted runner, from a checked-out repo
branding:
  icon: moon
  color: purple

inputs:
  config:
    description: Repo path of the night-shift config
    default: .night-shift/config.yml
  version:
    description: The nightshift-agent version to install
    required: true
  packages:
    description: Extra npm packages to install, such as the providers' CLIs, space-separated
    default: ''

runs:
  using: composite
  steps:
    - name: Check GH_TOKEN
      shell: bash
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::GH_TOKEN is empty: the job's secrets didn't reach it. Set the GH_TOKEN repository secret, or GH_TOKEN__<PERSON> in a shared control repo."
          exit 1
        fi
    # Preinstalled SDKs the runner doesn't need, about 20 GB (lessons.md, "Runners die quietly").
    - name: Free disk
      shell: bash
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - uses: actions/setup-node@v5
      with:
        node-version: 22
    - name: Install
      shell: bash
      run: npm install -g "nightshift-agent@$VERSION" $PACKAGES
      env:
        VERSION: ${{ inputs.version }}
        PACKAGES: ${{ inputs.packages }}
    - name: Commit as the token's user
      shell: bash
      run: |
        user=$(gh api user --jq '"\(.id)+\(.login)"')
        git config --global user.name "${user#*+}"
        git config --global user.email "$user@users.noreply.github.com"
    - name: Run
      shell: bash
      run: nightshift run ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
      env:
        NIGHT_SHIFT_CONFIG: ${{ inputs.config }}
    - name: Morning report
      if: always()
      shell: bash
      run: nightshift report >> "$GITHUB_STEP_SUMMARY" || true
      env:
        NIGHT_SHIFT_CONFIG: ${{ inputs.config }}
